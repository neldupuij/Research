project_name: "vol_spillovers_eu_financials"

# =============================================================================
# PATHS
# =============================================================================
paths:
  prices_raw:     "data/processed/prices_raw.csv"
  returns_daily:  "data/processed/returns.csv"
  returns_weekly: "data/processed/returns_weekly.csv"

  out_var_dy:     "outputs/var_dy"
  out_dcc:        "outputs/dcc_garch"
  out_compare:    "outputs/comparison_var_dcc"
  out_cluster:    "outputs/cluster_regimes"
  out_mst_global: "outputs/mst_global"
  out_mst_rolling: "outputs/mst_rolling"
  out_mst_port:   "outputs/mst_portfolio"
  out_freq_conn:  "outputs/freq_connectedness"

# =============================================================================
# PREPROCESSING
# =============================================================================
process:
  remove_late:       true
  min_start:         "2010-01-01"
  min_obs:           252
  drop_na_ratio_max: 0.20
  keep_min_symbols:  3

# =============================================================================
# VAR-DY (Diebold-Yilmaz connectedness)
# p_fixed   : lag order, held constant across all rolling windows (validated by 03_select_var_lag.R)
# rolling_window : W in weeks (~3 years)
# rolling_step   : thinning step between windows
# forecast_horizon : H for GFEVD
# =============================================================================
var_dy:
  p_fixed:          1
  rolling_window:   156
  rolling_step:     4
  forecast_horizon: 10

# =============================================================================
# DCC-GARCH
# strict : if true, fail when DCC does not converge (no fallback to sample corr)
# =============================================================================
garch_dcc:
  strict: false

# =============================================================================
# DATA
# =============================================================================
